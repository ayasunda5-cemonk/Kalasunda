<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalasunda - Kalender Tradisional Sunda</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="Css/Style.css">
  <meta name="theme-color" content="#1b2838">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e293b">
</head>
<body>

  <div class="app-container">
    <!-- Header Aplikasi -->
    <header class="app-header">
      <div class="logo-badge">ᮊᮜᮞᮥᮔ᮪ᮓ</div>
      <h1>KALASUNDA</h1>
      <p class="subtitle">Kalender Tradisional Sunda</p>
    </header>

    <!-- Navigation Header: Utama Bulan Sunda, Sekunder Masehi -->
    <div class="calendar-card">
      <div class="month-navigation">
        <button id="prev-btn" aria-label="Bulan Sebelumnya">&lt;</button>
        <div class="title-group">
          <!-- Bulan Sunda jadi visual utama -->
          <h2 id="sunda-month-display" class="sunda-month-title">-- ---- Caka</h2>
          <!-- Masehi jadi subtitle penjelas -->
          <span id="month-year-display" class="masehi-subtitle">-- ----</span>
        </div>
        <button id="next-btn" aria-label="Bulan Berikutnya">&gt;</button>
      </div>

      <!-- Info Utama Sunda (Highlight Card) -->
      <div class="sunda-hero-box">
        <div class="hero-item">
          <span class="hero-label">Pancawara</span>
          <span id="current-pancawara" class="hero-value accent-green">-</span>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-item">
          <span class="hero-label">Wuku</span>
          <span id="current-wuku" class="hero-value accent-gold">-</span>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-item">
          <span class="hero-label">Windu</span>
          <span id="current-windu" class="hero-value">-</span>
        </div>
      </div>

      <!-- Nama Hari Grid (Memuat Nama Hari Sunda & Umum) -->
      <div class="weekdays-grid">
        <div><span class="sunda-day">Rad</span><small>Min</small></div>
        <div><span class="sunda-day">Som</span><small>Sen</small></div>
        <div><span class="sunda-day">Ang</span><small>Sal</small></div>
        <div><span class="sunda-day">Rah</span><small>Rab</small></div>
        <div><span class="sunda-day">Bri</span><small>Kam</small></div>
        <div><span class="sunda-day">Suk</span><small>Jum</small></div>
        <div><span class="sunda-day">Tum</span><small>Sab</small></div>
      </div>

      <!-- Grid Tanggal -->
      <div id="calendar-days" class="days-grid"></div>
    </div>

    <!-- Detail Rincian Hari Terpilih -->
    <div class="detail-card" id="detail-card">
      <div class="detail-header">
        <h3>Detail Rincian Poë (Hari)</h3>
        <span id="detail-sunda-date" class="sunda-date-badge">-</span>
      </div>
      
      <div class="detail-grid">
        <div class="detail-item prominent">
          <label>Pancawara (Pasaran)</label>
          <strong id="detail-pancawara">-</strong>
        </div>
        <div class="detail-item prominent">
          <label>Wuku</label>
          <strong id="detail-wuku">-</strong>
        </div>
        <div class="detail-item">
          <label>Sadwara (6 Poë)</label>
          <span id="detail-sadwara">-</span>
        </div>
        <div class="detail-item">
          <label>Nepton / Naktu</label>
          <span id="detail-nepton">-</span>
        </div>
        <div class="detail-item full-width masehi-info">
          <label>Tanggal Masehi</label>
          <span id="detail-masehi">-</span>
        </div>
      </div>
    </div>
  </div>

  <script src="JS/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('SW terdaftar:', reg.scope))
        .catch((err) => console.log('SW gagal:', err));
    });
  }
  </script>
</body>
</html>
